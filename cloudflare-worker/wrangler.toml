name = "crosspost-license"
main = "worker.js"
compatibility_date = "2024-01-01"

# Custom domain (add in Cloudflare dashboard after deploy):
# license.crosspost-desktop.de → Workers → crosspost-license

# Environment variables — set LEMON_API_KEY as a Secret:
#   npx wrangler secret put LEMON_API_KEY
# Then set LEMON_STORE_ID as a plain variable below or as secret.

[vars]
# LEMON_STORE_ID = "12345"   # fill in after creating the store

[[routes]]
# Uncomment after adding crosspost-desktop.de to Cloudflare:
# pattern = "license.crosspost-desktop.de/*"
# zone_name = "crosspost-desktop.de"
