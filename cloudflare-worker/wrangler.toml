name = "crosspost-license"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── KV namespace ─────────────────────────────────────────────────────────────
# Create with: npx wrangler kv namespace create LICENSE_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "2dd2eecd4cc641bcbc8d7947bb26db1c"

# ── Plain variables (not secret) ─────────────────────────────────────────────
[vars]
# Stripe price IDs — copy from Stripe Dashboard → Products → price_xxx
STRIPE_PRICE_SOLO = "price_1Tx3zMP22GPrmrodtO54nOv6"
STRIPE_PRICE_PRO  = "price_1Tx41AP22GPrmrodu2nUht7o"

# URLs shown after checkout
SUCCESS_URL = "https://pilipandr770.github.io/Desktop-Poster-/#success"
CANCEL_URL  = "https://pilipandr770.github.io/Desktop-Poster-/#pricing"

# Sender address (must be verified in Resend)
FROM_EMAIL = "noreply@andrii-it.de"

# ── Secrets (set via wrangler secret put) ────────────────────────────────────
# npx wrangler secret put STRIPE_SECRET_KEY       ← sk_live_...
# npx wrangler secret put STRIPE_WEBHOOK_SECRET   ← whsec_...
# npx wrangler secret put RESEND_API_KEY          ← re_...

# ── Custom domain (add in Cloudflare dashboard after first deploy) ────────────
# Workers → crosspost-license → Settings → Domains & Routes
# → Add Custom Domain: license.crosspost-desktop.de
# (or use the default: crosspost-license.<your-subdomain>.workers.dev)
